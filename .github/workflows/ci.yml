name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commit:check -- --range ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm commit:check -- --title "$PR_TITLE"

  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      shared: ${{ steps.affected.outputs.shared }}
      ownmail: ${{ steps.affected.outputs.ownmail }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test affected-package selection
        run: node --test scripts/affected-packages.test.mjs
      - id: affected
        name: Find affected test packages
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/affected-packages.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --format github >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  package-tests:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test affected package and build its dependencies
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: pnpm turbo test --filter="$PACKAGE_NAME"

  # Each lab keeps its independent build/release checks; package tests are
  # selected from the workspace dependency graph and run in parallel above.
  ownmail:
    needs: changes
    if: needs.changes.outputs.ownmail == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build typecheck --filter=...{labs/ownmail/packages/*}
      - run: pnpm --filter @ownmail/app smoke:ssr
      - run: pnpm smoke:ownmail-release

  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build typecheck --filter='./shared/*'
