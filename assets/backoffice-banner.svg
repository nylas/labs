  <text x="94" y="190" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="#000000">Nylas Backoffice</text>
  <rect x="96" y="216" width="88" height="6" fill="url(#signature)"/>
  <text x="96" y="266" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="500" fill="#8E8E8E">Operations for every workspace.</text>

  <g transform="translate(832, 116)">
    <rect width="352" height="150" rx="12" fill="#212121"/>
    <rect width="352" height="150" rx="12" fill="none" stroke="#404040"/>
