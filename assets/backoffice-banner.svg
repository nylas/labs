  <text x="96" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#8E8E8E">github.com/nylas/labs</text>
  <text x="1184" y="378" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#8E8E8E">MIT · powered by nylas.com</text>
