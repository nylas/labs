      <stop stop-color="#0B9B8A"/>
      <stop offset="1" stop-color="#E01BE0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="#FFFFFF"/>
  <line x1="64" y1="0" x2="64" y2="400" stroke="#D8D8D8"/>
  <line x1="1216" y1="0" x2="1216" y2="400" stroke="#D8D8D8"/>
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#D8D8D8"/>
  <line x1="0" y1="344" x2="1280" y2="344" stroke="#D8D8D8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="3">
